name: lumenor_hrms_flutter
description: "Lumenor HRMS Flutter app for employee attendance management with face recognition and geolocation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase for backend
  supabase_flutter: ^1.10.0

  # HTTP and networking
  http: ^1.1.0
  dio: ^5.3.0

  # Internationalization
  intl: ^0.19.0

  # Geolocation
  geolocator: ^10.1.0

  # Camera and image
  image_picker: ^1.0.5
  camera: ^0.10.5

  # On-device face detection + liveness (blink/smile/head-turn)
  google_mlkit_face_detection: ^0.9.0
  permission_handler: ^11.3.0

  # Local storage
  shared_preferences: ^2.2.2

  # Verify company admin password (bcrypt hashes shared with the Streamlit portal)
  bcrypt: ^1.1.3

  # State management
  provider: ^6.1.0

  # Utilities
  uuid: ^4.0.0
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

